<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1B1B22" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="openRPG — 오픈월드 판타지 RPG 웹 프로토타입"
    />
    <title>openRPG</title>
    <style>
      html {
        font-size: 16px;
      }
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      html,
      body {
        height: 100vh;
        height: 100dvh;
        overscroll-behavior: none;
      }
      #app {
        position: relative;
      }
      #canvas-container,
      #canvas-container canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overscroll-behavior: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="canvas-container"></div>
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
